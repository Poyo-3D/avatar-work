":""}]},"notes":[{"id":"note-0","title":"Booth 에셋 관련","text":"본 작업은 사용하는 모든 Booth 에셋을 신청자와 작업자 모두 소유하는 것을 원칙으로 진행합니다.\n따라서, 작업자가 보유중이지 않은 에셋으로 작업 요청 시 본인용 에셋을 구매 후 작업자용 에셋도 Booth 기프트로 전달주셔야 합니다.\n작업 신청 시 사용할 에셋의 상업적 이용, 2차 가공 및 수정, 스트리밍 방송에서의 사용 가능 여부를 직접 확인 후 신청부탁드립니다.\n이용 약관을 확인하지 않아 발생되는 모든 책임은 신청자에게 있습니다.","open":false},{"id":"note-1","title":"작업 가능 범위","text":"현재 아바타 성형 및 페이셜 작업은 별도로 진행하지 않습니다.\n성형 및 페이셜 작업이 끝난 완성된 아바타가 있으신 경우에만 신청 부탁드립니다.","open":false},{"id":"note-2","title":"파일의 제공 및 보관","text":"작업 파일은 기본적으로 작업 종료일로부터 별도 안내없이 한달간 보관 후 삭제합니다.\n추가 작업을 원하시는 경우 반드시 미리 말씀부탁드립니다.","open":false},{"id":"note-f2174684-030f-4b47-998d-e54b4ede866f","title":"작업 순서 및 일정","text":"작업은 문의 순서대로가 아닌 결제 순서대로 진행합니다.\n작업 중 답변이 24시간 이상 지연될 경우 다음 신청자 작업부터 진행 및 완료 일정이 지연될 수 있습니다.","open":false},{"id":"note-3d5a1238-556f-4bde-9015-0ccef5fb9cce","title":"작업 파일의 에셋 제한","text":"기본적으로 한 파일 당 헤어 / 의상 각각 3개까지만 작업합니다.\n요청주실 경우 초과 작업도 가능하나, 아래의 사항이 적용됩니다.\n\n- 신청자의 요청으로 한 파일에 작업되는 에셋의 개수를 늘려 발생되는 버벅임은 해결해드리지 않습니다.\n- 이로 인한 파일 분리 요청 시 분리 작업 추가금이 발생됩니다.","open":false}],"works":[{"id":"work-9761a77e-1552-4b4d-8cd5-abf819f9de2e","title":"🤍 CHZZK 설이엔님 🤍","text":"뚜따 + 매지카2 +\nNiltoon 컨버팅 + Warudo 포스트 프로세싱 세팅","tag":"","url":"","media":[{"id":"media-03c6f021-482f-4afa-8e9b-a05e86570a86","src":"assets/poyo-commission-studio-20261025/9b97da3e7d7093ce8e8b366373f8156ae046d5ff.png","alt":"🤍 CHZZK 설이엔님 🤍"},{"id":"media-e8cfa975-d42d-4a6c-9306-9c4862290d97","src":"assets/poyo-commission-studio-20261025/ce95c1a39c1919976c169c00e3584bfbb68a3d11.png","alt":"🤍 CHZZK 설이엔님 🤍"},{"id":"media-6698f67f-7eab-4e9b-9056-a8f7d1a97899","src":"assets/poyo-commission-studio-20261025/eba07c1d20ea517d02464b979a774d9cf4c9d6d8.png","alt":"🤍 CHZZK 설이엔님 🤍"},{"id":"media-5025a9b3-3877-4d62-9f52-79b2122fe0bd","src":"assets/poyo-commission-studio-20261025/f19a1a6ca8386607a2be7cb66b7c7fe8c355f725.png","alt":"🤍 CHZZK 설이엔님 🤍"},{"id":"media-13b2e14d-6c3a-4119-9061-d653e6a77b0c","src":"assets/poyo-commission-studio-20261025/86d0ba1b2f
