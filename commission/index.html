function works(index){return '<section class="page-section" id="works">'+sectionHead('works',index,'')+'<div class="works-stage"><button class="works-edge previous" data-act="works-scroll" data-dir="-1" aria-label="이전 포트폴리오">‹</button><div class="works-track" id="works-track">'+(C.works.length?C.works.map((w,i)=>{const src=mediaSrc(w.media?.[0]?.src);return '<article class="work-card">'+(src?'<button class="work-media" data-act="open-gallery" data-work="'+esc(w.id)+'" aria-label="'+esc(w.title)+' 사진 크게 보기"><img src="'+esc(src)+'" alt="'+esc(w.media[0].alt||w.title)+'" loading="lazy"><span class="photo-count">'+w.media.length+' '+(w.media.length===1?'PHOTO':'PHOTOS')+' ↗</span></button>':'<div class="work-placeholder">'+String(i+1).padStart(2,'0')+'</div>')+'<div class="work-copy">'+(w.tag?'<div class="work-tag">'+esc(w.tag)+'</div>':'')+'<h3>'+esc(w.title)+'</h3><p>'+esc(w.text)+'</p>'+(link(w.url)?'<a href="'+esc(link(w.url))+'" target="_blank" rel="noopener">작업 자세히 보기 ↗</a>':'')+'</div></article>';}).join(''):'<div class="empty-work">새로운 작업을 준비하고 있어요.</div>')+'</div><button class="works-edge next" data-act="works-scroll" data-dir="1" aria-label="다음 포트폴리오">›</button></div></section>';}
function estimate(index){return '<section class="page-section" id="estimate">'+sectionHead('estimate',index)+'<div id="quote-box"></div></section>';}
function quote(){const lines=[];for(const g of C.quote.groups)for(const item of g.items){const count=Math.max(0,Math.min(99,Math.floor(Number(state.counts[item.id])||0)));if(count){const unit=price(item.price);lines.push({label:item.label,quantity:count,amount:unit===null?null:unit*count});}}if(state.mode==='first'&&lines.length&&C.quote.baseEnabled!==false){lines.unshift({label:C.quote.baseLabel||'첫 작업 세팅비',quantity:1,amount:price(C.quote.basePrice)});}return {lines,total:lines.reduce((sum,l)=>sum+(l.amount??0),0),pending:lines.some(l=>l.amount===null)};}
function total(q){return q.pending?(q.total?money(q.total)+' + 확인 필요':'금액 확인 필요'):money(q.total);}
function renderQuote(){if(!$('#quote-box'))return;const q=quote(),detail=state.mode==='return'?C.quote.returnUrl:C.quote.detailUrl;$('#quote-box').innerHTML='<div class="quote-shell"><div class="quote-options"><div class="quote-modes"><button class="mode '+(state.mode==='first'?'active':'')+'" data-act="quote-mode" data-mode="first" aria-pressed="'+(state.mode==='first')+'">'+esc(C.quote.firstLabel)+'</button><button class="mode '+(state.mode==='return'?'active':'')+'" data-act="quote-mode" data-mode="return" aria-pressed="'+(state.mode==='return')+'">'+esc(C.quote.returnLabel)+'</button></div>'+C.quote.groups.map(g=>'<div class="quote-group"><h3>'+esc(g.title)+'</h3>'+g.items.map(item=>{const count=Math.max(0,Math.min(99,Math.floor(Number(state.counts[item.id])||0))),unit=price(item.price);return '<div class="quote-row"><div class="quote-item"><p class="quote-item-title">'+esc(item.label)+'</p>'+(item.description?'<p class="quote-item-note">'+esc(item.description)+'</p>':'')+'<p class="quote-unit">'+esc(money(unit))+' / '+esc(item.unit||'개')+'</p></div><div class="counter"><button data-act="count" data-id="'+esc(item.id)+'" data-delta="-1" aria-label="'+esc(item.label)+' 수량 줄이기" '+(!count?'disabled':'')+'>−</button><input type="number" min="0" max="99" step="1" data-count="'+esc(item.id)+'" value="'+count+'" aria-label="'+esc(item.label)+' 수량"><button data-act="count" data-id="'+esc(item.id)+'" data-delta="1" aria-label="'+esc(item.label)+' 수량 늘리기" '+(count===99?'disabled':'')+'>+</button></div><strong class="row-amount">'+esc(count?money(unit===null?null:unit*count):'—')+'</strong></div>';}).join('')+'</div>').join('')+'</div><aside class="quote-result"><div class="estimate-card"><div class="estimate-top"><span class="tiny">YOUR ESTIMATE</span></div><p class="estimate-label">선택한 작업의 예상 금액</p><p class="estimate-total" aria-live="polite">'+esc(total(q))+'</p><div class="estimate-lines">'+(q.lines.length?q.lines.map(l=>'<div class="estimate-line"><span>'+esc(l.label)+(l.quantity>1?' × '+l.quantity:'')+'</span><strong>'+esc(money(l.amount))+'</strong></div>').join(''):'<p class="estimate-placeholder">작업할 항목을 선택하면<br>예상 견적이 여기에 정리돼요.</p>')+'</div></div><p class="quote-notice">'+esc(C.quote.notice)+'</p><div class="quote-actions"><button class="btn btn-main" data-act="copy-quote">견적 내용 복사 ↗</button>'+(link(detail)?'<a class="btn btn-light" href="'+esc(link(detail))+'" target="_blank" rel="noopener">상세 견적 작성 ↗</a>':'')+'</div></aside></div>';if(preview)parent.postMessage({type:'commission-preview-state',revision:preview.revision,state},'*');}
function inquiryText(){const q=quote();return ['['+C.brand+' · 예상 견적]',state.mode==='first'?C.quote.firstLabel:C.quote.returnLabel,'',...q.lines.map(l=>l.label+(l.quantity>1?' × '+l.quantity:'')+': '+money(l.amount)),'','예상 금액: '+total(q),C.quote.notice].join('\n');}
function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,3200);}
document.getElementById('app').innerHTML='<header class="site-top"><div class="wrap top-inner"><a class="brand" href="#hello"><span class="brand-mark">p</span>'+esc(C.brand)+'</a><nav class="site-nav" aria-label="페이지 내용"><a href="#hello" class="active">'+esc(C.sections.hello.nav)+'</a>'+order.map(id=>'<a href="#'+id+'">'+esc(C.sections[id].nav)+'</a>').join('')+'</nav>'+(link(C.hero.contactUrl)?'<a class="nav-contact" href="'+esc(link(C.hero.contactUrl))+'" target="_blank" rel="noopener">'+esc(C.hero.contactLabel)+'</a>':'')+'</div></header><main class="wrap">'+hero()+order.map((id,i)=>({collaborators:collaboratorsHtml,schedule,notes,works,estimate}[id])(i)).join('')+'<footer class="footer"><span>'+esc(C.brand)+'</span><a href="#hello">맨 위로 ↑</a></footer></main><div class="toast" id="toast" role="status" hidden></div><dialog id="gallery-dialog"><div class="gallery-top"><strong id="gallery-title"></strong><button class="icon-button" data-act="close-gallery" aria-label="사진 닫기">×</button></div><img id="gallery-image" class="gallery-image" alt=""><div class="gallery-bottom"><button class="icon-button" data-act="gallery-step" data-dir="-1" aria-label="이전 사진">←</button><span id="gallery-count"></span><button class="icon-button" data-act="gallery-step" data-dir="1" aria-label="다음 사진">→</button></div><p id="gallery-caption" class="gallery-caption"></p></dialog><dialog id="copy-dialog"><h3>견적 내용 복사</h3><textarea readonly class="copy-area" id="copy-area"></textarea><button class="btn btn-main" data-act="close-copy">닫기</button></dialog>';
renderQuote();function galleryRender(){const work=C.works.find(w=>w.id===gallery.work);if(!work?.media.length)return;gallery.index=(gallery.index+work.media.length)%work.media.length;const photo=work.media[gallery.index];$('#gallery-title').textContent=work.title;$('#gallery-image').src=mediaSrc(photo.src);$('#gallery-image').alt=photo.alt||work.title;$('#gallery-count').textContent=(gallery.index+1)+' / '+work.media.length;$('#gallery-caption').textContent=work.text;document.querySelectorAll('[data-act="gallery-step"]').forEach(b=>b.hidden=work.media.length<2);}
function scrollControls(){const track=$('#works-track');if(!track)return;const media=track.querySelector('.work-media,.work-placeholder'),stage=track.closest('.works-stage');if(media&&stage)stage.style.setProperty('--works-arrow-top',(media.getBoundingClientRect().top-stage.getBoundingClientRect().top+media.getBoundingClientRect().height/2)+'px');const left=$('[data-act="works-scroll"][data-dir="-1"]'),right=$('[data-act="works-scroll"][data-dir="1"]');left.disabled=track.scrollLeft<3;right.disabled=track.scrollLeft+track.clientWidth>=track.scrollWidth-3;}
$('#works-track')?.addEventListener('scroll',scrollControls,{passive:true});window.addEventListener('resize',scrollControls);requestAnimationFrame(scrollControls);
document.addEventListener('click',async event=>{const t=event.target.closest('[data-act]');if(!t)return;const act=t.dataset.act;if(act==='works-scroll'){$('#works-track').scrollBy({left:Number(t.dataset.dir)*($('#works-track').clientWidth*.45),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}if(act==='count'){state.counts[t.dataset.id]=Math.max(0,Math.min(99,(Number(state.counts[t.dataset.id])||0)+Number(t.dataset.delta)));renderQuote();}if(act==='quote-mode'){state.mode=t.dataset.mode;renderQuote();}if(act==='open-gallery'){gallery={work:t.dataset.work,index:0};galleryRender();$('#gallery-dialog').showModal();}if(act==='close-gallery')$('#gallery-dialog').close();if(act==='gallery-step'){gallery.index+=Number(t.dataset.dir);galleryRender();}if(act==='copy-quote'){if(!quote().lines.length){toast('작업할 항목을 먼저 선택해 주세요.');return;}try{await navigator.clipboard.writeText(inquiryText());toast('견적 내용을 복사했어요.');}catch{$('#copy-area').value=inquiryText();$('#copy-dialog').showModal();$('#copy-area').select();}}if(act==='close-copy')$('#copy-dialog').close();});
document.addEventListener('change',event=>{const el=event.target;if(!el.matches('[data-count]'))return;state.counts[el.dataset.count]=Math.max(0,Math.min(99,Math.floor(Number(el.value)||0)));renderQuote();});
document.addEventListener('keydown',event=>{if(!$('#gallery-dialog').open)return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();gallery.index+=event.key==='ArrowRight'?1:-1;galleryRender();}});$('#gallery-dialog').addEventListener('click',event=>{if(event.target===$('#gallery-dialog')){const r=event.target.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)event.target.close();}});
let queued=false;function activeNav(){queued=false;const y=window.scrollY+Math.min(220,innerHeight*.28);let active='hello';for(const id of ['hello',...order]){const node=document.getElementById(id);if(node&&node.getBoundingClientRect().top+window.scrollY<=y)active=id;}document.querySelectorAll('.site-nav a').forEach(a=>{const selected=a.getAttribute('href')==='#'+active;a.classList.toggle('active',selected);if(selected)a.setAttribute('aria-current','location');else a.removeAttribute('aria-current');});}window.addEventListener('scroll',()=>{if(!queued){queued=true;requestAnimationFrame(activeNav);}},{passive:true});activeNav();window.CommissionPage={config:C,state,quote,inquiryText,renderQuote};
})();</script></body></html>
